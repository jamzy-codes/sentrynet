<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOT Sentinel — Security Monitoring</title>
  <meta name="description" content="BOT Sentinel is a premium on-chain security monitoring platform for verifying autonomous agent identity, behaviour, and cryptographic provenance." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="shell.css" />
  <link rel="icon" type="image/png" href="public/logo.png" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       APP SHELL
  ════════════════════════════════════════════════ -->
  <div id="app-shell">

    <!-- SIDEBAR ──────────────────────────────────── -->
    <aside id="sidebar" aria-label="Main navigation">

      <!-- Logo row (same height as topbar) -->
      <div id="sidebar-logo-row">
        <!-- BOT Sentinel logo -->
        <div id="logo-icon" aria-hidden="true">
          <img src="public/logo.png" alt="" width="36" height="36"
               style="display:block;object-fit:contain;background:transparent;" />
        </div>
        <!-- Wordmark — slides in on hover -->
        <span id="logo-wordmark" aria-label="BOT Sentinel">BOT SENTINEL</span>
      </div>

      <!-- Nav items -->
      <nav id="sidebar-nav" aria-label="Primary navigation">

        <button class="nav-item active" data-page="overview" id="nav-overview"
                aria-label="Overview" title="Overview">
          <span class="nav-icon" aria-hidden="true">
            <!-- Grid / Layout icon -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <rect x="2" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <rect x="10" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <rect x="2" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
              <rect x="10" y="10" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </span>
          <span class="nav-label">Overview</span>
        </button>

        <button class="nav-item" data-page="agent-identity" id="nav-agent-identity"
                aria-label="Agent Identity" title="Agent Identity">
          <span class="nav-icon" aria-hidden="true">
            <!-- Fingerprint / ID icon -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M6 9C6 7.34 7.34 6 9 6C10.66 6 12 7.34 12 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M4.5 9C4.5 6.51 6.51 4.5 9 4.5C11.49 4.5 13.5 6.51 13.5 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M3 9C3 5.69 5.69 3 9 3C12.31 3 15 5.69 15 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M7.5 9C7.5 8.17 8.17 7.5 9 7.5C9.83 7.5 10.5 8.17 10.5 9C10.5 11 9 13.5 9 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M6 11.5C6.5 13 7.5 15 9 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M12 11C12.33 11.83 12.5 12.5 12.5 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="nav-label">Agent Identity</span>
        </button>

        <button class="nav-item" data-page="live-monitoring" id="nav-live-monitoring"
                aria-label="Live Monitoring" title="Live Monitoring">
          <span class="nav-icon" aria-hidden="true">
            <!-- Activity / Pulse icon -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <polyline points="1.5,9 4.5,9 6.5,3.5 9,14.5 11.5,6 13.5,9 16.5,9"
                        stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="nav-label">Live Monitoring</span>
        </button>

        <button class="nav-item" data-page="verification" id="nav-verification"
                aria-label="Verification" title="Verification">
          <span class="nav-icon" aria-hidden="true">
            <!-- Shield-check icon -->
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 1.5L2.5 4.25V8.5C2.5 12.17 5.33 15.6 9 16.5C12.67 15.6 15.5 12.17 15.5 8.5V4.25L9 1.5Z"
                    stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M6.5 9L8 10.5L11.5 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="nav-label">Verification</span>
        </button>

      </nav>

      <!-- Sidebar footer: operator address -->
      <div id="sidebar-footer">
        <span class="footer-dot" aria-hidden="true">
          <svg width="7" height="7" viewBox="0 0 7 7" fill="none">
            <circle cx="3.5" cy="3.5" r="3.5" fill="#4F9CF9" opacity="0.7"/>
          </svg>
        </span>
        <span id="operator-address" class="mono"
              title="Fetching operator address…">
          <span class="footer-prefix">Operator</span>&nbsp;<span class="footer-addr">…</span>
        </span>
      </div>

    </aside>

    <!-- RIGHT COLUMN: topbar + main content -->
    <div id="right-column">

      <!-- TOPBAR ─────────────────────────────────── -->
      <header id="topbar" role="banner">
        <div id="topbar-left">
          <nav aria-label="Breadcrumb" id="breadcrumb">
            <span class="breadcrumb-home">Home</span>
            <span class="breadcrumb-sep" aria-hidden="true">/</span>
            <span class="breadcrumb-current" id="breadcrumb-current">Overview</span>
          </nav>
        </div>
        <div id="topbar-right">
          <!-- Live indicator -->
          <button id="live-indicator" aria-label="Live feed active" title="Live feed active">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="live-label">Live</span>
            <span class="live-chevron" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M3 4.5L6 7.5L9 4.5"
                      stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>

          <!-- Notifications -->
          <button id="notif-btn" aria-label="3 notifications">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M9 2C9 2 5.5 3.5 5.5 8.5V11.5L3.5 13H14.5L12.5 11.5V8.5C12.5 3.5 9 2 9 2Z"
                    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M7.5 13C7.5 13.83 8.17 14.5 9 14.5C9.83 14.5 10.5 13.83 10.5 13"
                    stroke="currentColor" stroke-width="1.3"/>
            </svg>
            <span class="notif-badge" id="notif-badge" aria-label="3 unread">3</span>
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT AREA ──────────────────────── -->
      <main id="main-content" role="main">
        <div id="page-container"></div>
      </main>

    </div><!-- /right-column -->

  </div><!-- /app-shell -->

  <script src="shell.js"></script>
</body>
</html>
